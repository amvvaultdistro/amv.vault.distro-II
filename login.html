<!DOCTYPE html>
<html lang="zxx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Access | AMV Vault</title>
    
    <link rel="icon" type="image/jpeg" href="img/download.jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

    <style>
        :root { --gold: #D4AF37; --black: #000; --card: #0a0a0a; }
        body { 
            background: var(--black); 
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            background: radial-gradient(circle at center, #1a1500 0%, #000 100%);
        }

        .login-card {
            background: var(--card);
            border: 1px solid #222;
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-logo { width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--gold); margin-bottom: 20px; }

        .gold-input {
            background: #111;
            border: 1px solid #333;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            width: 100%;
        }

        .gold-input:focus {
            background: #151515;
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .btn-vault {
            background: var(--gold);
            color: #000;
            font-weight: 900;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s;
        }

        .btn-vault:hover { background: #fff; transform: translateY(-2px); }

        .login-links { display: flex; justify-content: space-between; margin-top: 20px; }
        .back-link { color: #555; text-decoration: none; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .back-link:hover { color: var(--gold); }

        /* Modal Custom Styling */
        .modal-content { background: #0a0a0a; border: 1px solid var(--gold); color: white; border-radius: 20px; }
        .modal-header { border-bottom: 1px solid #222; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="img/download.jpg" class="login-logo" alt="Vault">
        <h4 class="fw-900 mb-4" style="letter-spacing: 2px;">VIP LOGIN</h4>
        
        <form id="loginForm">
            <input type="email" class="gold-input" placeholder="EMAIL ADDRESS" required>
            <input type="password" class="gold-input" placeholder="PASSWORD" required>
            
            <button type="submit" class="btn-vault">AUTHENTICATE</button>
        </form>

        <div class="login-links">
            <a href="index.html" class="back-link">← EXIT</a>
            <a href="#" class="back-link" data-bs-toggle="modal" data-bs-target="#forgotModal">FORGOT PASSWORD?</a>
        </div>
    </div>

    <div class="modal fade" id="forgotModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-3">
                <div class="modal-header border-0">
                    <h5 class="fw-900 gold-text uppercase">RECOVER ACCESS</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="small text-muted mb-4">Enter your registered email. If an account exists, we will send a restoration link to the Vault.</p>
                    <form id="recoveryForm">
                        <input type="email" class="gold-input" placeholder="YOUR EMAIL ADDRESS" required>
                        <button type="submit" class="btn-vault mt-2">SEND LINK</button>
                    </form>
                    <div id="recoveryMsg" class="mt-3 small gold-text d-none">Request sent. Check your inbox.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Main Login Logic
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "VERIFYING...";
            btn.style.opacity = "0.7";

            setTimeout(() => {
                window.location.href = "vip-dashboard.html";
            }, 1200);
        });

        // Recovery Logic
        document.getElementById('recoveryForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const msg = document.getElementById('recoveryMsg');
            
            btn.innerText = "PROCESSING...";
            btn.disabled = true;

            setTimeout(() => {
                btn.classList.add('d-none');
                msg.classList.remove('d-none');
            }, 1500);
        });
    </script>

</body>
</html>
