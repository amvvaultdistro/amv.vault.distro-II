<!DOCTYPE html>
<html lang="zxx">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARTIST VAULT | AMV Distribution</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --gold: #D4AF37; --dark-bg: #050505; --card-bg: #0a0a0a; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        .sidebar { background: #000; border-right: 1px solid #1a1a1a; height: 100vh; padding: 30px 15px; position: fixed; width: 250px; z-index: 100; }
        .main-content { margin-left: 250px; padding: 40px; }
        
        .vault-card { background: var(--card-bg); border: 1px solid #1a1a1a; padding: 25px; border-radius: 12px; margin-bottom: 20px; transition: 0.3s; }
        .vault-card:hover { border-color: var(--gold); }
        
        .status-badge { font-size: 8px; padding: 3px 8px; border-radius: 4px; font-weight: 900; text-transform: uppercase; }
        .status-pending { background: rgba(212, 175, 55, 0.1); color: var(--gold); border: 1px solid var(--gold); }
        .status-live { background: rgba(0, 255, 0, 0.1); color: #00ff00; border: 1px solid #00ff00; }
        
        .vault-input { background: #000; border: 1px solid #222; color: #fff; padding: 12px; font-size: 13px; border-radius: 6px; }
        .vault-input:focus { border-color: var(--gold); box-shadow: none; color: #fff; background: #000; }
        
        .cover-preview { width: 150px; height: 150px; background: #111; border: 1px dashed #333; border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 10px; }
        .cover-preview img { width: 100%; height: 100%; object-fit: cover; }

        .btn-vault { background: var(--gold); color: #000; font-weight: 900; border: none; padding: 12px; border-radius: 6px; font-size: 12px; text-transform: uppercase; transition: 0.3s; width: 100%; }
        .btn-vault:hover { background: #fff; transform: translateY(-2px); }

        .nav-link { color: #888; font-size: 11px; text-transform: uppercase; padding: 12px; display: block; text-decoration: none; transition: 0.3s; cursor: pointer; border-radius: 6px; margin-bottom: 5px; }
        .nav-link:hover, .nav-link.active { color: var(--gold); background: rgba(212, 175, 55, 0.05); }

        .content-section { display: none; animation: fadeIn 0.4s ease; }
        .content-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Checkbox Style */
        .form-check-input:checked { background-color: var(--gold); border-color: var(--gold); }
        #isrcInputContainer, #customGenreContainer { display: none; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h5 class="gold-text mb-1 fw-900" style="color:var(--gold)">ARTIST VAULT</h5>
        <p class="small text-muted mb-5" style="font-size: 10px;">PREMIUM DISTRIBUTION</p>
        
        <a onclick="showSection('releases')" id="nav-releases" class="nav-link active">My Releases</a>
        <a onclick="showSection('analytics')" id="nav-analytics" class="nav-link">Analytics</a>
        <a onclick="showSection('royalties')" id="nav-royalties" class="nav-link">Royalties</a>
        <hr style="border-color: #222;">
        <a href="index.html" class="nav-link text-danger">Logout</a>
    </div>

    <div class="main-content">
        
        <div id="section-releases" class="content-section active">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="fw-900 m-0">NEW <span class="gold-text" style="color:var(--gold)">SUBMISSION</span></h2>
                <div class="small text-muted">Artist Plan: <span class="text-white">Active</span></div>
            </div>

            <div class="row">
                <div class="col-lg-7">
                    <div class="vault-card">
                        <form id="uploadForm">
                            <div class="mb-3">
                                <label class="small fw-bold text-muted mb-2">RELEASE TITLE</label>
                                <input type="text" id="releaseTitle" class="form-control vault-input" placeholder="e.g. Durban Nights" required>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="small fw-bold text-muted mb-2">GENRE</label>
                                    <select id="genre" class="form-select vault-input" onchange="toggleCustomGenre()">
                                        <option value="Amapiano">Amapiano</option>
                                        <option value="Gqom">Gqom</option>
                                        <option value="Afro-Tech">Afro-Tech</option>
                                        <option value="Hip-Hop">Hip-Hop / Rap</option>
                                        <option value="RnB">RnB</option>
                                        <option value="CUSTOM">-- Other / Custom --</option>
                                    </select>
                                    <div id="customGenreContainer">
                                        <input type="text" id="customGenreInput" class="form-control vault-input" placeholder="Enter custom genre">
                                    </div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="small fw-bold text-muted mb-2">RELEASE DATE</label>
                                    <input type="date" id="releaseDate" class="form-control vault-input" required>
                                </div>
                            </div>

                            <div class="mb-3 p-3 border border-secondary rounded bg-black">
                                <div class="form-check form-switch mb-2">
                                    <input class="form-check-input" type="checkbox" id="hasIsrc" onchange="toggleIsrc()">
                                    <label class="form-check-label small fw-bold text-muted" for="hasIsrc">I HAVE MY OWN ISRC (RE-RELEASE)</label>
                                </div>
                                <div id="isrcInputContainer">
                                    <input type="text" id="customIsrc" class="form-control vault-input" placeholder="Enter ISRC (e.g. ZA-A12-23-12345)">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="small fw-bold text-muted mb-2">AUDIO FILE</label>
                                <input type="file" id="audioFile" class="form-control vault-input" accept="audio/*" required>
                            </div>
                            <button type="submit" id="submitBtn" class="btn-vault">UPLOAD TO VAULT</button>
                        </form>
                    </div>
                </div>

                <div class="col-lg-5">
                    <div class="vault-card text-center">
                        <label class="small fw-bold text-muted mb-2 d-block">COVER ART</label>
                        <center>
                            <div class="cover-preview" id="coverPreview">
                                <span class="text-muted small">3000 x 3000px</span>
                            </div>
                        </center>
                        <input type="file" id="artFile" class="form-control vault-input mt-2" accept="image/*" onchange="previewArt(this)" required>
                    </div>

                    <div class="vault-card">
                        <h6 class="fw-900 small mb-3">LATEST STATUS</h6>
                        <div id="submissionList"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="section-analytics" class="content-section">
             <h2 class="fw-900 mb-4">STREAMING <span class="gold-text" style="color:var(--gold)">INSIGHTS</span></h2>
             <div class="vault-card text-center py-5">
                 <p class="text-muted">Analytics will populate once your first release is Live.</p>
             </div>
        </div>

        <div id="section-royalties" class="content-section">
            <h2 class="fw-900 mb-4">ROYALTY <span class="gold-text" style="color:var(--gold)">TREASURY</span></h2>
            <div class="vault-card bg-white text-dark text-center py-5">
                <h1 class="fw-900">R 0.00</h1>
                <p class="small fw-bold">No earnings to report yet.</p>
            </div>
        </div>
    </div>

    <script>
        const SB_URL = 'https://evfywprduobqiwruvxfr.supabase.co';
        const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2Znl3cHJkdW9icWl3cnV2eGZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4NzI0NjYsImV4cCI6MjA4ODQ0ODQ2Nn0.IiVO1pZsYcy7--JiqCV0WKIKyH3-BGwBcvbJa5P589k';
        const _supabase = supabase.createClient(SB_URL, SB_KEY);

        function showSection(id) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById('section-' + id).classList.add('active');
            document.getElementById('nav-' + id).classList.add('active');
        }

        // Toggle Custom Genre Input
        function toggleCustomGenre() {
            const select = document.getElementById('genre');
            const container = document.getElementById('customGenreContainer');
            container.style.display = select.value === 'CUSTOM' ? 'block' : 'none';
        }

        function toggleIsrc() {
            const container = document.getElementById('isrcInputContainer');
            const checkbox = document.getElementById('hasIsrc');
            container.style.display = checkbox.checked ? 'block' : 'none';
        }

        async function loadReleases() {
            const { data: releases } = await _supabase.from('artist_releases').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('submissionList');
            if (releases && releases.length > 0) {
                list.innerHTML = releases.map(r => `
                    <div class="d-flex justify-content-between align-items-center mb-3 p-2 border border-secondary rounded">
                        <div>
                            <div class="small fw-bold">${r.title}</div>
                            <div style="font-size: 10px;" class="text-muted">${r.genre} • ${r.isrc || 'ISRC: Pending'}</div>
                        </div>
                        <span class="status-badge ${r.status === 'Live' ? 'status-live' : 'status-pending'}">${r.status}</span>
                    </div>
                `).join('');
            } else {
                list.innerHTML = `<div class="text-muted small py-3 text-center">No releases found.</div>`;
            }
        }

        function previewArt(input) {
            const container = document.getElementById('coverPreview');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => container.innerHTML = `<img src="${e.target.result}">`;
                reader.readAsDataURL(input.files[0]);
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = "PROCESSING...";

            try {
                const audio = document.getElementById('audioFile').files[0];
                const art = document.getElementById('artFile').files[0];
                const fileName = Date.now();
                
                // Determine Genre
                let finalGenre = document.getElementById('genre').value;
                if (finalGenre === 'CUSTOM') {
                    finalGenre = document.getElementById('customGenreInput').value || 'Unknown Genre';
                }

                const isrcValue = document.getElementById('hasIsrc').checked ? document.getElementById('customIsrc').value : null;

                const { data: aData } = await _supabase.storage.from('vault-assets').upload(`audio/${fileName}_${audio.name}`, audio);
                const { data: iData } = await _supabase.storage.from('vault-assets').upload(`covers/${fileName}_${art.name}`, art);

                const { error: dbErr } = await _supabase.from('artist_releases').insert([{
                    title: document.getElementById('releaseTitle').value,
                    genre: finalGenre,
                    release_date: document.getElementById('releaseDate').value,
                    audio_url: aData.path,
                    art_url: iData.path,
                    isrc: isrcValue,
                    status: 'In Review'
                }]);

                if (dbErr) throw dbErr;
                alert("Release submitted successfully!");
                location.reload();
            } catch (err) {
                alert("Error: " + err.message);
                btn.disabled = false;
                btn.innerText = "UPLOAD TO VAULT";
            }
        });

        loadReleases();
    </script>
</body>
</html>
